[project]
name = "dehashed-osint"
version = "0.1.0"
description = ""
authors = [
    {name = "Landon Mayo",email = "landonmayo722@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.137.2,<0.138.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "reportlab (>=5.0.0,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.18,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "types-reportlab (>=4.5.1.20260521,<5.0.0.0)"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
# alembic/ contains auto-generated migration files and env.py boilerplate;
# exclude them so generated code doesn't fail the lint gate.
extend-exclude = ["alembic/"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# Tests legitimately use bare asserts (S101) and fake credentials as literals
# (S105/S106 hardcoded-password false positives) throughout this OSINT suite.
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106"]
# FastAPI uses Depends() in function default arguments — this is the canonical
# pattern endorsed by FastAPI's own docs; B008 cannot be avoided here.
"src/api/**/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# alembic/ contains auto-generated boilerplate with untyped stubs; exclude it.
# mypy already scopes to `files = ["src"]` so this is belt-and-suspenders.
exclude = ["alembic/"]
# pydantic plugin teaches mypy that BaseSettings fields load from env, so a
# no-arg Settings() call is valid and not "missing required argument".
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
