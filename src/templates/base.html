<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>DeHashed · Case Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <span class="brand">
      <span class="mark" aria-hidden="true"></span>
      DeHashed <span class="sub">· Case Console</span>
    </span>
    <nav class="mast-nav">
      <a href="/">Cases</a>
      <a href="/ui/audit">Audit log</a>
      <span class="status"><span class="dot" aria-hidden="true"></span> <span class="label">Restricted</span></span>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
